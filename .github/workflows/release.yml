name: Release

# Push a tag like v0.1.0 to publish a GitHub release with the wheel, the source archive,
# RPMs for current Fedora releases, and the installer script.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  rpm:
    name: RPM for Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container: fedora:${{ matrix.fedora }}
    strategy:
      matrix:
        fedora: ["43", "44"]
    steps:
      - name: Install build dependencies
        run: >
          dnf -y install git rpm-build pyproject-rpm-macros python3-devel python3-hatchling
          python3-dbus-fast python3-pytest python3-pytest-asyncio desktop-file-utils appstream
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: build/rpm/RPMS/noarch/*.rpm

  publish:
    needs: rpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: uv build
      - uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: rpms
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' \
            CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/* rpms/*.rpm install.sh
          --title "Shokzer ${GITHUB_REF_NAME#v}" --notes-file notes.md
