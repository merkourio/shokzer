[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shokzer"
version = "0.1.0.dev0"
description = "Fedora controller for Shokz OpenRun Pro 2 headset settings"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = ["dbus-fast>=2.21"]

[project.scripts]
shokzer = "shokzer.cli:main"

# Needs Fedora's PyGObject, GTK 4 and Libadwaita (system packages, not from PyPI).
[project.gui-scripts]
shokzer-gui = "shokzer.ui:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shokzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -p no:anyio"
markers = [
    "hardware: talks to a real headset; runs only with SHOKZ_HARDWARE=1 and SHOKZ_DEVICE set",
    "gui: needs GTK 4, Libadwaita and a display; skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/shokzer"]

# PyGObject ships no type information; GTK calls are unchecked, our own code isn't.
[[tool.mypy.overrides]]
module = ["gi", "gi.*"]
ignore_missing_imports = true
