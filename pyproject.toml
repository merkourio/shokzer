[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "shokzctl"
version = "0.1.0.dev0"
description = "Fedora controller for Shokz OpenRun Pro 2 headset settings"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["dbus-fast>=2.21"]

[project.scripts]
shokzctl = "shokzctl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shokzctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -p no:anyio"
markers = [
    "hardware: talks to a real headset; runs only with SHOKZ_HARDWARE=1 and SHOKZ_DEVICE set",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/shokzctl"]
